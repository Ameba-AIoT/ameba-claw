# CONFIG_LUA_DRIVER_TESTS is not set
CONFIG_LONGER_CMD=y
CONFIG_USB_OTG_EN_MENU=y
CONFIG_USB_HOST_EN_MENU=y
CONFIG_USBH_UVC_MENU=y
CONFIG_USBH_MSC_MENU=y

CONFIG_APPLICATION_SHELL_TASK_STACK_SIZE_MENU=8192
# 1MB for flash VFS, which is enough for 512KB of LittleFS (the rest is for the FATFS image)
CONFIG_FLASH_VFS1_SIZE=0x100000

# read-only "rolfs:" littlefs image: built-in skills + prebuilt Lua libs/docs are
# packed into the app image (see ameba_add_rolfs_content in CMakeLists.txt)
CONFIG_LITTLEFS_WITHIN_APP_IMG=y
