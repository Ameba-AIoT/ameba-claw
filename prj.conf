# This file is generated automatically by : python menuconfig.py -s /home/miles_wang/ameba_claw_proj/ameba_claw/prj.conf
CONFIG_LONGER_CMD=y
CONFIG_LITTLEFS_WITHIN_APP_IMG=y
CONFIG_PLATFORM_FREERTOS=y
CONFIG_CLKCFG_1P0_AUDIO_USB=y
CONFIG_USB_OTG_EN_MENU=y
CONFIG_USB_HOST_EN_MENU=y
CONFIG_APPLICATION_SHELL_TASK_STACK_SIZE_MENU=8192
CONFIG_GPIO_IRQ_TABLE_MAX_NUM=16
# Flash layout: compact single-slot, fits in 8MB (0x08000000..0x087FFFFF).
# NOTE: OTA2 cannot be disabled (offset 0xFFFFFFFF) — the ROM bootloader reads the
# OTA2 image header when selecting a slot and bus-faults on an unmapped address.
# So BOOT_OTA2/APP_OTA2 are kept as minimal *valid* regions (256K each, never
# flashed) and their leftover space goes to OTA1. Dev flashes OTA1 directly.
# Regions (base 0x08000000): BOOT 0..3FFFF(256K), OTA1 40000..37FFFF(3.25M),
# BOOT_OTA2 380000..3BFFFF, OTA2 3C0000..3FFFFF, VFS1 400000..7FFFFF(4M).
# Total = 0x800000 = 8MB exactly.
CONFIG_MBEDTLS_ENABLED_MENU=y
CONFIG_IMG2_PSRAM=y
CONFIG_FLASH_OTA1_SIZE=0x340000
CONFIG_FLASH_BOOT_OTA2_OFFSET=0x8380000
CONFIG_FLASH_BOOT_OTA2_SIZE=0x40000
CONFIG_FLASH_OTA2_OFFSET=0x83C0000
CONFIG_FLASH_OTA2_SIZE=0x40000
CONFIG_FLASH_VFS1_OFFSET=0x8400000
CONFIG_FLASH_VFS1_SIZE=0x400000
# LVGL graphics — required by lua_module_display (ST7789 command canvas).
CONFIG_GRAPHIC_UI_MENU=y
CONFIG_LVGL_ENABLE=y
CONFIG_LVGL_9_3=y

# CONFIG_CLAW_LUA_DRIVER_TESTS=y

# SD card via SDHC (SDIOH) + FatFS — storage module depends on these
CONFIG_VFS_FATFS_INCLUDED=y
CONFIG_FATFS_DISK_SD_MENU=y
CONFIG_FATFS_SD_HOTPLUG_MENU=y
